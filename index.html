<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧩 Block Blast Solver</h1>
            <p>Entrez l'état actuel de votre grille et les blocs proposés pour obtenir la meilleure solution</p>
            <div style="text-align: center; margin-top: 15px;">
                <a href="demo.html" style="color: #667eea; text-decoration: none; margin: 0 10px;">📖 Guide & Démo</a>
                <a href="test.html" style="color: #667eea; text-decoration: none; margin: 0 10px;">🧪 Tests</a>
            </div>
        </header>

        <div class="main-content">
            <!-- Section: Grille de jeu -->
            <section class="grid-section">
                <h2>Grille de jeu (8x8)</h2>
                <div class="controls">
                    <button id="clearGrid" class="btn btn-secondary">Effacer la grille</button>
                    <button id="toggleMode" class="btn btn-secondary">Mode: Placer</button>
                </div>
                <div id="gameGrid" class="game-grid"></div>
            </section>

            <!-- Section: Blocs disponibles -->
            <section class="blocks-section">
                <h2>Blocs disponibles</h2>
                <p class="instruction">Sélectionnez jusqu'à 3 blocs parmi les formes suivantes:</p>
                <div id="blockPalette" class="block-palette"></div>

                <h3>Blocs sélectionnés (max 3)</h3>
                <div id="selectedBlocks" class="selected-blocks">
                    <div class="empty-slot">Slot 1</div>
                    <div class="empty-slot">Slot 2</div>
                    <div class="empty-slot">Slot 3</div>
                </div>
                <button id="clearBlocks" class="btn btn-secondary">Effacer les blocs</button>
            </section>

            <!-- Section: Solution -->
            <section class="solution-section">
                <h2>Solution</h2>
                <button id="solve" class="btn btn-primary">🎯 Trouver la meilleure solution</button>
                <div id="solutionResult" class="solution-result"></div>
            </section>
        </div>
    </div>

    <script src="blockShapes.js"></script>
    <script src="solver.js"></script>
    <script src="app.js"></script>
</body>
</html>
